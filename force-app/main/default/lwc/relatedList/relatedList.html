<template>
    <lightning-card title="Contacts">
        <div class="table-container">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading contacts" size="small">
                </lightning-spinner>
            </template>

            <div class="slds-table">
                <div class="table-header">
                    <div class="table-row">
                        <template for:each={columns} for:item="column">
                            <div key={column.fieldApiName} class="table-cell">
                                {column.label}
                            </div>
                        </template>
                    </div>
                </div>

                <div class="table-body">
                    <template for:each={contacts} for:item="record">
                        <div key={record.Id} class="table-row">
                            <template for:each={columns} for:item="column">
                                <div key={column.fieldApiName} class="table-cell">
                                    <c-related-list-cell record={record} column={column}>
                                    </c-related-list-cell>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
